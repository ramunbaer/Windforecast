name: wind-alert

on:
  schedule:
    # Stuendlich (GitHub-Cron laeuft in UTC; die Tageszeit-Filterung erfolgt lokal im Code).
    - cron: "0 * * * *"
  workflow_dispatch: {}   # erlaubt manuelles Ausloesen im Actions-Tab

concurrency:
  group: wind-alert
  cancel-in-progress: false

permissions:
  contents: write         # noetig, um data/ zurueck ins Repo zu committen

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wind-Alarm ausfuehren
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m windalert.main

      - name: Verlaufsdaten committen
        run: |
          git config user.name  "wind-bot"
          git config user.email "wind-bot@users.noreply.github.com"
          git config merge.ours.driver true   # Treiber fuer 'merge=ours' (siehe .gitattributes)
          git add data/
          if git diff --staged --quiet; then
            echo "Keine Aenderungen an data/."
            exit 0
          fi
          git commit -m "data: $(date -u +%FT%TZ)"
          # Rennsicherer Push: bei zwischenzeitlichem Remote-Update rebasen und erneut versuchen
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push ok (Versuch $i)."
              exit 0
            fi
            echo "Push abgelehnt – rebase auf origin/main und erneut (Versuch $i)…"
            git pull --rebase --autostash origin main || true
          done
          echo "Push nach mehreren Versuchen fehlgeschlagen." >&2
          exit 1
